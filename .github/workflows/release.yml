name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/desktop/package-lock.json
            packages/core/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Install core deps
        working-directory: packages/core
        run: npm ci

      - name: Build core
        working-directory: packages/core
        run: npm run build

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Test
        working-directory: apps/desktop
        run: npm run test -- --coverage

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Extract notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Grab section for this tag from CHANGELOG.md (between ## [TAG] and next ## [)
          awk -v tag="## [$TAG]" '
            $0 ~ tag {p=1; print; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > /tmp/notes.md || echo "Release $TAG" > /tmp/notes.md
          cat /tmp/notes.md
          echo "notes_file=/tmp/notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          generate_release_notes: true
          files: |
            apps/desktop/dist/**

      - name: Summary
        run: echo "Released ${{ steps.notes.outputs.tag }}"
