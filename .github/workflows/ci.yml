name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint • Typecheck • Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/desktop/package-lock.json
            packages/core/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci

      - name: Build core (required for desktop imports)
        working-directory: packages/core
        run: npm run build

      - name: Lint (desktop)
        working-directory: apps/desktop
        run: npm run lint

      - name: Lint (core)
        working-directory: packages/core
        run: npm run lint --if-present || echo "core lint not configured"

      - name: Format check (desktop)
        working-directory: apps/desktop
        run: npm run format:check

      - name: Typecheck (desktop)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Typecheck (core)
        working-directory: packages/core
        run: npm run typecheck

      - name: Test (desktop)
        working-directory: apps/desktop
        run: npm run test

      - name: Test (core)
        working-directory: packages/core
        run: npm run test

      - name: Audit (desktop, high severity)
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Audit (core)
        working-directory: packages/core
        run: npm audit --audit-level=high

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Cargo clippy (warnings as warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings || echo "clippy warnings found"
