name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint • Typecheck • Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/desktop/package-lock.json
            packages/core/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci

      - name: Build core (required for desktop imports)
        working-directory: packages/core
        run: npm run build

      - name: Lint (desktop)
        working-directory: apps/desktop
        run: npm run lint

      - name: Lint (core)
        working-directory: packages/core
        run: npm run lint --if-present || echo "core lint not configured"

      - name: Format check (desktop)
        working-directory: apps/desktop
        run: npm run format:check

      - name: Typecheck (desktop)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Typecheck (core)
        working-directory: packages/core
        run: npm run typecheck

      - name: Test (desktop)
        working-directory: apps/desktop
        run: npm run test

      - name: Coverage (desktop)
        working-directory: apps/desktop
        run: npm run test -- --coverage

      - name: Integration test (desktop)
        working-directory: apps/desktop
        run: npm run test -- src/db.integration.test.ts

      - name: Test (core)
        working-directory: packages/core
        run: npm run test

      - name: Build desktop (for size check)
        working-directory: apps/desktop
        run: npm run build

      - name: Size limit (500kB JS / 100kB CSS)
        working-directory: apps/desktop
        run: npx size-limit --json || npx size-limit

      - name: Audit (desktop, high severity)
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Audit (core)
        working-directory: packages/core
        run: npm audit --audit-level=high

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Cargo clippy (warnings as warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings || echo "clippy warnings found"

      - name: Cargo audit (requires cargo-audit)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --ignore RUSTSEC-0000-0000 || echo "cargo audit reported issues (non-blocking for now)"

  gitleaks:
    name: Gitleaks (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM + deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-sbom-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install cargo-deny and cargo-cyclonedx
        run: |
          cargo install cargo-deny --locked || true
          cargo install cargo-cyclonedx --locked || true

      - name: Cargo deny check
        working-directory: apps/desktop/src-tauri
        run: |
          cargo deny check advisories || echo "deny advisories check (non-blocking)"
          cargo deny check licenses || echo "deny licenses check (non-blocking)"

      - name: Generate SBOM (CycloneDX)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo cyclonedx --format json --override-filename sbom.cyclonedx.json || echo "cyclonedx failed (non-blocking)"
          ls -lh sbom.cyclonedx.json || echo "no SBOM generated"
          cat sbom.cyclonedx.json | head -n 20 || true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: apps/desktop/src-tauri/sbom.cyclonedx.json
          if-no-files-found: warn

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
            packages/core/package-lock.json

      - name: Install root dependencies (playwright)
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci

      - name: Build core
        working-directory: packages/core
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E smoke
        run: npx playwright test e2e/smoke.spec.ts
